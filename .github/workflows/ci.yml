name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vms
          POSTGRES_PASSWORD: vms
          POSTGRES_DB: vms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vms -d vms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://vms:vms@localhost:5432/vms_test
      # Build-time only; not a real secret.
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-real
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src scripts tests
      - run: npm test
      - run: npm run build
